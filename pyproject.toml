[project]
name = "xcore-sdk-python"
version = "0.1.0"
description = "xCore SDK CLI and six-axis robot client"
readme = "README.md"
authors = [
    { name = "RightOrNot", email = "jue1251665735@outlook.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "dynamixel-sdk>=3.7",
    "numpy>=1.24",
    "pyzmq>=27.0",
]

[project.scripts]
xcore-sdk-python = "xcore_sdk_python.cli:main"
xcore = "xcore_sdk_python.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["example", "Release"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/xcore_sdk_python/gello_leader.py" = ["E501"]
"src/xcore_sdk_python/gello_follower.py" = ["E501"]
"src/xcore_sdk_python/dynamixel_reader.py" = ["E501"]
